function burnU(p,o,c,m){let k=-1;o.fr.forEach((e,i)=>{if(e&&pw(o,i)<=m&&(k<0||pw(o,i)>pw(o,k)))k=i});if(k>=0){lg(c.n+' destroys '+o.fr[k].n+'.');kill(o,k)}}
function disc(o,n){if(o.hand.length){const x=o.hand.splice(Math.floor(Math.random()*o.hand.length),1)[0];o.gv.push(x);lg(n+': enemy discards '+x.n+'.')}}
function runOp(x,p,o,c,slot,row){if(x=='draw1'){draw(p);lg(c.n+' draws 1.')}else if(x=='draw2'){draw(p,2);lg(c.n+' draws 2.')}else if(x=='grow1'){const u=p[row][slot];if(u){u.pw++;lg(c.n+' grows.')}}else if(x=='burn4')burnU(p,o,c,4);else if(x=='burn6')burnU(p,o,c,6);else if(x=='disc1')disc(o,c.n);else if(x=='hex2'){o.fr.forEach(u=>u&&(u.b-=2));lg(c.n+' weakens enemy front units.')}else if(x=='aeth1'){p.ae++;lg(c.n+': +1 Aether.')}else if(x=='swarm'){p.fr.forEach(u=>u&&(u.b+=1));lg(c.n+' empowers your front units.')}else if(x=='recur'){const u=p.gy.pop();if(u){const k=p.gv.indexOf(u);if(k>=0)p.gv.splice(k,1);p.hand.push({...u});lg(c.n+' recovers '+u.n+'.')}}else if(x=='reap')burnU(p,o,c,Math.min(9,p.gy.length+2));else if(x=='mute'){o.sl=1;lg(c.n+' silences the enemy Leader.')}else if(x=='seek'){const k=p.deck.findIndex(z=>z.t=='spell');if(k>=0){const z=p.deck.splice(k,1)[0];p.hand.push(z);shuf(p);lg(c.n+' finds '+z.n+'.')}}else if(x=='sear')dmgL(o,1,c.n);else if(x=='sac'){let k=-1;p.fr.forEach((e,i)=>{if(e&&!(row=='fr'&&i==slot)&&(k<0||pw(p,i)<pw(p,k)))k=i});if(k>=0){lg(c.n+' sacrifices '+p.fr[k].n+'.');kill(p,k);draw(p,2)}}}
const SX={bolt:{tg:'e',m:5,r:(p,o,k)=>{lg('Bolt destroys '+o.fr[k].n+'.');kill(o,k)}},fire:{tg:'e',m:6,r:(p,o,k)=>{lg('Dragonfire destroys '+o.fr[k].n+'.');kill(o,k)}},bolt4:{tg:'e',m:4,r:(p,o,k)=>{lg('Ambush destroys '+o.fr[k].n+'.');kill(o,k)}},siphon:{tg:'e',m:5,r:(p,o,k)=>{lg('Soul Siphon destroys '+o.fr[k].n+'.');kill(o,k);disc(o,'Soul Siphon')}},hexT:{tg:'e',m:99,r:(p,o,k)=>{o.fr[k].b-=3;lg(o.fr[k].n+' is withered.')}},surge:{tg:'a',r:(p,o,k)=>{p.fr[k].b+=3;lg(p.fr[k].n+' surges.')}},blaze:{tg:'a',r:(p,o,k)=>{p.fr[k].b+=4;p.nc=1;lg(p.fr[k].n+' blazes.')}},roar:{tg:'a',r:(p,o,k)=>{p.fr[k].b+=2;p.nc=1;lg(p.fr[k].n+' roars.')}},grow:{tg:'a',any:1,r:(p,o,k)=>{p.fr[k].pw+=2;lg(p.fr[k].n+' grows.')}},rally:{ok:p=>p.fr.some(u=>u),r:p=>{p.fr.forEach(u=>u&&(u.b+=2));lg('Your front units rally.')}},sweep:{ok:(p,o)=>o.fr.some((u,i)=>u&&pw(o,i)<=3),r:(p,o)=>{o.fr.forEach((u,i)=>{if(u&&pw(o,i)<=3)kill(o,i)});lg('Inferno sweeps the field.')}},disc1:{ok:(p,o)=>o.hand.length>0,r:(p,o)=>disc(o,'Whisper')},growAll:{ok:p=>p.fr.some(u=>u),r:p=>{p.fr.forEach(u=>u&&u.pw++);lg('Spring Growth empowers your front units.')}},tribute:{tg:'a',any:1,r:(p,o,k)=>{p.fr[k].b+=4;lg(p.fr[k].n+' is empowered.')}},pactP:{tg:'a',any:1,r:(p,o,k)=>{p.fr[k].pw+=2;p.nc=Math.max(p.nc||0,1);lg(p.fr[k].n+' grows darker.')}},ramp:{r:p=>{p.ae+=2;lg('Wild Bloom: +2 Aether.')}},draw2:{r:p=>{draw(p,2);lg('Insight draws 2.')}},draw3:{r:p=>{draw(p,3);lg('Grand Index draws 3.')}},warp:{r:p=>{draw(p);p.ae++;lg('Time Warp: draw 1, +1 Aether.')}},recall:{ok:p=>p.gy.length>0,r:p=>{const u=p.gy.pop(),k=p.gv.indexOf(u);if(k>=0)p.gv.splice(k,1);p.hand.push({...u});lg('Grave Call returns '+u.n+'.')}},pact:{ok:p=>p.fr.some(u=>u),r:p=>{let k=-1;p.fr.forEach((u,i)=>{if(u&&(k<0||pw(p,i)<pw(p,k)))k=i});lg('Pact sacrifices '+p.fr[k].n+'.');kill(p,k);draw(p,2);p.ae++}}};

const stU=ch=>(rec.sp||{})[ch]||1;
let sch=0;
function chOpen(ch){return ch==0||stU(ch-1)>CHAPS[ch-1].tiles.length}
function storyOpen(ch,ti){if(!chOpen(ch)||ti>=stU(ch))return;const t=CHAPS[ch].tiles[ti];if(t.k=='s'){sv={ch,ti,li:0};render()}else storyBattle(ch,ti)}
function storyAdv(){const t=CHAPS[sv.ch].tiles[sv.ti];if(sv.li<t.L.length-1){sv.li++;render();return}storyFin(sv.ch,sv.ti)}
function storySkip(){storyFin(sv.ch,sv.ti)}
function storyFin(ch,ti){rec.sp=rec.sp||{};rec.sg=rec.sg||{};const id=ch*10+ti;if(!rec.sg[id]){rec.sg[id]=1;rec.g=(rec.g||0)+10;tt='+10 gems for completing a story tile.'}rec.sp[ch]=Math.max(stU(ch),ti+2);saveRec();const T=CHAPS[ch].tiles,n=ti+1;sv=null;view='story';sch=ch;if(n>=T.length){if(ch<CHAPS.length-1)sch=ch+1;render();return}if(T[n].k=='s'){sv={ch,ti:n,li:0};render()}else storyBattle(ch,n)}
function storyDone(){const id=G.story;G=null;storyFin(Math.floor(id/10),id%10)}
function storyRetry(){const id=G.story;G=null;storyBattle(Math.floor(id/10),id%10)}
function storyBattle(ch,ti){const t=CHAPS[ch].tiles[ti],id=ch*10+ti;view='story';sv=null;if(t.tut)sb({id,tut:1,pf:0,pc:null,pl:RUBY,af:5,al:3,df:0});else{const m=myDeck();sb({id,pf:m.f,pc:m.c,pl:m.l,af:t.af,df:t.df,al:t.al,ac:t.ac,cl:t.cl})}}
function storyHTML(){const tn=tt?`<div class='p'><b>${tt}</b></div>`:'';tt='';if(sv){const t=CHAPS[sv.ch].tiles[sv.ti],l=t.L[sv.li];return `${tn}<div class='sc'>${bg(t.bg)}<div class='cast'>${t.cast.map(k=>`<div class='ch ${k==l[0]?'':'dim'}'>${chr(k)}</div>`).join('')}</div></div><div class='p'><b>${CH[l[0]].n}</b><p style='font-size:16px;min-height:70px'>${l[1]}</p><div class='hd'><small>${CHAPS[sv.ch].t} - ${t.n} - ${sv.li+1} of ${t.L.length}</small><span><button onclick='storySkip()'>Skip scene</button> <button class='go' onclick='storyAdv()'>${sv.li<t.L.length-1?'Next':'Continue'}</button></span></div></div>`}const C=CHAPS[sch],u=stU(sch);return `<h1>Story</h1>${tn}<div class='p hd'><b>Gems: ${rec.g||0}</b><button onclick='go(5)'>Main menu</button></div>${deckSel()}<div class='p'><div class='row'>${[1,2].map(s=>`<button class='${C.se==s?'on':''}' ${chOpen((s-1)*10)?'':'disabled'} onclick='sch=${(s-1)*10};render()'>Season ${s}</button>`).join('')}</div><div class='row'>${CHAPS.map((c,i)=>c.se==C.se?`<button class='${i==sch?'on':''}' ${chOpen(i)?'':'disabled'} onclick='sch=${i};render()'>${i%10+1}</button>`:'').join('')}</div><h2>Season ${C.se}, Chapter ${sch%10+1}: ${C.t}</h2><p><small>${C.s}</small></p>${C.tiles.map((t,i)=>`<div class='row'><button style='flex:1;text-align:left' ${i>=u||!chOpen(sch)?'disabled':''} onclick='storyOpen(${sch},${i})'><b>${t.k=='s'?'Story':'Battle'}: ${t.n}</b><br><small>${i>=u?'Locked':i<u-1?'Replay':'Play'}</small></button></div>`).join('')}<small>Battles use your story deck (chosen above), except the tutorial. First clear of each tile earns 10 gems, plus 40 more for winning a battle tile. Each season ends with its biggest battle.</small></div><div class='p'><h2>Characters</h2><div class='fg'>${Object.keys(CH).map(k=>`<div class='p'><div class='gal'>${chr(k)}</div><b>${CH[k].n}</b><br><small>${CH[k].a?'Age '+CH[k].a+'. ':''}${CH[k].d}</small></div>`).join('')}</div></div>`}
let sdk=rec.sd||'m';
function setSdk(v){sdk=v;rec.sd=v;saveRec();render()}
function deckSel(){const dk=rec.dk||[];return `<div class='p'><b>Story deck</b><select style='width:100%' aria-label='Story deck' onchange='setSdk(this.value)'><option value='m'${sdk=='m'?' selected':''}>Main deck: Solar Dominion starter (Leader ${LDR[0][RUBY].n.split(' ')[0]})</option>${dk.map((d,i)=>`<option value='c${i}'${sdk=='c'+i?' selected':''}${chk(d.c).ok?'':' disabled'}>Custom: ${esc(d.name)} (${F[d.f].k}, ${LDR[d.f][d.ld||0].n.split(' ')[0]})${chk(d.c).ok?'':' - not valid'}</option>`).join('')}</select>${dk.length?'':`<p><small>Build a custom deck in Deck Building to use it here.</small></p>`}</div>`}
let um='';
function hostHTML(){if(!window.ASTRA_BUILD)return '';return `<div class='p'><b>Game version</b><p><small>Build ${esc(window.ASTRA_BUILD)}. The game checks for updates by itself and offers a reload when a new version is published. Your progress and decks are kept.</small></p><div class='row'><button onclick='updChk(1)'>Check for updates</button><button class='go' onclick='shareGame()'>Share link</button></div>${um?`<p><b>${um}</b></p>`:''}</div>`}
function shareGame(){const u=location.origin+location.pathname;if(navigator.share)navigator.share({title:'ASTRACROWN',text:'Play ASTRACROWN: Legacy of the Six',url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u)}catch(e){}um='Link copied: '+u;render()}}
function updChk(manual){if(!window.ASTRA_BUILD)return;fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.build&&j.build!==window.ASTRA_BUILD)showUpd();else if(manual){um='You already have the latest version.';render()}}).catch(()=>{if(manual){um='Could not check right now. Are you online?';render()}})}
function showUpd(){if(document.getElementById('upd'))return;const d=document.createElement('div');d.id='upd';d.setAttribute('role','status');d.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;background:#f5a524;color:#201400;padding:10px;border-radius:10px;font:14px system-ui,sans-serif;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap';d.innerHTML=`<span>A new version of ASTRACROWN is ready. Updating reloads the game, so finish any battle first. Your progress is kept.</span><span><button id='updGo' class='go'>Update now</button> <button id='updLater'>Later</button></span>`;document.body.appendChild(d);document.getElementById('updGo').onclick=updNow;document.getElementById('updLater').onclick=()=>d.remove()}
function updNow(){const go=()=>location.reload();try{navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}).then(go)}catch(e){go()}}
if(window.ASTRA_BUILD){setTimeout(updChk,4000);setInterval(updChk,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updChk()})}
